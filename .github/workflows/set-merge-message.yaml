name: Set Merge Commit Message from Branch

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  set-pr-title:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Extract conventional commit message from branch name
        id: parse
        run: |
          BRANCH="${{ github.head_ref }}"
          REGEX='^([a-z]+(\([^)]+\))?)/(.+)$'

          if [[ "$BRANCH" =~ $REGEX ]]; then
            TYPE="${BASH_REMATCH[1]}"
            DESC="${BASH_REMATCH[3]//[-_]/ }"
            echo "title=${TYPE}: ${DESC}" >> $GITHUB_OUTPUT
          else
            echo "Branch '$BRANCH' doesn't match expected format"
            exit 1
          fi

      - name: Update PR title
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              title: process.env.PR_TITLE
            });
        env:
          PR_TITLE: ${{ steps.parse.outputs.title }}
