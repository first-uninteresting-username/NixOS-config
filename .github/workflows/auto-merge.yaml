name: Merge verified dependency updates

on:
  workflow_run:
    workflows: ["Flake build"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: read
  checks: read
  statuses: read

concurrency:
  group: dependency-merge-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  merge:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # Never execute code from the PR with this workflow's write token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify actual diff, required statuses and current revision
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          python3 .github/scripts/auto-merge.py \
            --repository "$GITHUB_REPOSITORY" --run-id "$RUN_ID" \
            --summary "$GITHUB_STEP_SUMMARY"
