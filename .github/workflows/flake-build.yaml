name: Flake build

on:
  schedule:
    - cron: "0 8 * * 4"
  workflow_dispatch:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  discover:
    name: Discover CI targets
    runs-on: ubuntu-latest
    outputs:
      fullMatrix: ${{ steps.matrices.outputs.fullMatrix }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Read Nix config
        shell: bash
        run: |
          {
            echo 'NIX_CONF<<EOF'
            cat .github/nix.conf
            echo 'EOF'
          } >> "$GITHUB_ENV"

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf: ${{ env.NIX_CONF }}

      - name: Generate matrices
        id: matrices
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "fullMatrix=$(nix eval --json '.#githubActions.fullMatrix')" \
            >> "$GITHUB_OUTPUT"

  build:
    name: ${{matrix.type}} - ${{ matrix.name }} (${{ matrix.system }})
    needs: discover
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 17
      matrix: ${{ fromJSON(needs.discover.outputs.fullMatrix) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: wimpysworld/nothing-but-nix@687c797a730352432950c707ab493fcc951818d7 # v10
        with:
          hatchet-protocol: cleave

      - name: Read Nix config
        shell: bash
        run: |
          {
            echo 'NIX_CONF<<EOF'
            cat .github/nix.conf
            echo 'EOF'
          } >> "$GITHUB_ENV"

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf: ${{ env.NIX_CONF }}

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: matrix
          authToken: "${{matrix.type != 'checks' && secrets.CACHIX_AUTH_TOKEN || ''}}"
          installCommand: "nix profile add nixpkgs#cachix"

      - name: Build check
        run: |
          CHECKS_ONLY_FLAGS=""
          if [ "${{ matrix.type }}" != "checks" ] && [ -n "${{ secrets.CACHIX_AUTH_TOKEN }}" ]; then
            CHECKS_ONLY_FLAGS="--cachix-cache matrix"
          fi

          nix run github:Mic92/nix-fast-build -- \
            --no-nom \
            --skip-cached \
            --flake '.#${{ matrix.attr }}' \
            $CHECKS_ONLY_FLAGS

  report:
    runs-on: ubuntu-latest
    needs: [discover, build]
    if: always() && (failure() || cancelled()) && github.event_name != 'pull_request'
    permissions:
      contents: read
      issues: write
    steps:
      - name: Report failures to issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const failed = [];
            for (let page = 1; ; page++) {
              const { data } = await github.rest.actions.listJobsForWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
                per_page: 100,
                page,
              });
              failed.push(
                ...data.jobs
                  .filter(j =>
                    ['failure', 'cancelled'].includes(j.conclusion) &&
                    !['Discover CI targets', 'report', 'All Systems Passed'].includes(j.name)
                  )
                  .map(j => `- \`${j.name}\` — [logs](${j.html_url})`)
              );
              if (data.jobs.length < 100) break;
            }

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'ci-failure',
              state: 'open'
            });

            const title = 'Flake build failures';
            const body =
              `## Flake Build Failures\n\n` +
              `**Workflow:** ${context.workflow}\n` +
              `**Run:** [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})\n\n` +
              `### Failed steps\n${failed.join('\n') || 'Unknown — check run logs'}`;

            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['ci-failure']
              });
            }

  all-systems-passed:
    name: all-systems-passed
    runs-on: ubuntu-latest
    needs: [discover, build]
    if: always()
    steps:
      - name: Check build status
        env:
          DISCOVER: ${{ needs.discover.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          set -Eeuo pipefail
          echo "discover=${DISCOVER}"
          echo "build=${BUILD}"

          if [ "$DISCOVER" != success ]; then
            echo "::error::discover ended as ${DISCOVER}"
            exit 1
          fi
          if [ "$BUILD" != success ] && [ "$BUILD" != skipped ]; then
            echo "::error::build ended as ${BUILD}"
            exit 1
          fi
