name: Flake check

on:
  push:
    branches: [main]
  workflow_call:
    outputs:
      success:
        value: ${{ jobs.check.outputs.success }}

permissions:
  contents: read

jobs:
  check:
    name: Basic validation
    runs-on: ubuntu-latest
    outputs:
      success: ${{ steps.check.outputs.success }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Read Nix config
        shell: bash
        run: |
          {
            echo 'NIX_CONF<<EOF'
            cat .github/nix.conf
            echo 'EOF'
          } >> "$GITHUB_ENV"

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf: ${{ env.NIX_CONF }}

      - name: Validate formatting and lints
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p logs
          {
            # Templates are incomplete examples; discovery fixtures are deliberately excluded.
            nix run --inputs-from . nixpkgs#alejandra -- --check . \
              --exclude modules/_template \
              --exclude hosts/_template.nix \
              --exclude lib/modules/tests/discovery/modules/_ignored
            nix run --inputs-from . nixpkgs#deadnix -- --fail --exclude \
              modules/_template \
              hosts/_template.nix \
              lib/modules/tests/discovery/modules/_ignored
            nix run --inputs-from . nixpkgs#statix -- check . \
              --ignore modules/_template \
              --ignore hosts/_template.nix \
              --ignore lib/modules/tests/discovery/modules/_ignored
          } 2>&1 | tee logs/lints.log

      - name: Validate CI selection and merge policy
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m unittest discover -s .github/scripts/tests -v 2>&1 | tee logs/policy.log
          node --test .github/scripts/tests/*.test.cjs 2>&1 | tee logs/branch-policy.log

      - name: Evaluate every supported system
        id: check
        shell: bash
        run: |
          set -Eeuo pipefail
          nix flake check --no-build --all-systems 2>&1 | tee logs/evaluation.log
          nix eval --json .#evalTests 2>&1 | tee logs/host-eval-tests.log
          python3 lib/modules/tests/run.py 2>&1 | tee logs/module-library.log
          echo 'success=true' >> "$GITHUB_OUTPUT"

      - name: Retain validation failure logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: basic-validation-logs
          path: logs/
          retention-days: 14
