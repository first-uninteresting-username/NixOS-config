name: Update Packages

on:
  workflow_dispatch:
    inputs:
      packages:
        description: JSON array of package names (empty array updates all packages)
        type: string
        default: "[]"
  schedule:
    - cron: 0 6 * * 1,4

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ secrets.PAT }}

      - name: Read Nix config
        shell: bash
        run: |
          {
            echo 'NIX_CONF<<EOF'
            cat .github/nix.conf
            echo 'EOF'
          } >> "$GITHUB_ENV"
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf: ${{ env.NIX_CONF }}

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: matrix
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          installCommand: "nix profile add nixpkgs#cachix"

      # The runner rolls back a failed package, so successful updates still reach the PR.
      - name: Update packages
        id: update
        continue-on-error: true
        env:
          PACKAGES: ${{ inputs.packages || '[]' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -t selected < <(jq -r '.[]' <<< "$PACKAGES")
          nix run .#update-packages -- "${selected[@]}"

      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR if changed
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.PAT }}
          commit-message: "deps: update packages"
          title: "chore(update): biweekly package update"
          body: |
            Automated package updates from each package's `passthru.updateScript`.
            See docs/package-updates.md.
          branch: "chore(update)/package-updates"
          delete-branch: true
          labels: dependencies

      - name: Fail on unsuccessful updates
        if: steps.update.outcome == 'failure'
        run: |
          echo "::error::Some package updates failed; see the Update packages step."
          exit 1
